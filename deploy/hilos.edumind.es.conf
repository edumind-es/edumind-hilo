# ============================================================================
# hilos.edumind.es — EDUmind Hilo (PWA estática, sin backend)
#
# Alta (requiere root):
#   sudo python3 /var/www/.edumind_ops/hilos_site_install.py
# que copia este fichero y hilos-security-headers.inc a sites-available,
# emite el certificado si falta y recarga nginx.
#
# La raíz es un enlace simbólico que mueve desplegar.sh: nunca hay un
# directorio a medias.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    http2 on;
    server_name hilos.edumind.es;
    include /etc/nginx/sites-available/cloudflare-origin-guard.inc;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hilos.edumind.es;
    include /etc/nginx/sites-available/cloudflare-origin-guard.inc;

    root /var/www/edumind_hilo/apps/web/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/hilos.edumind.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hilos.edumind.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/hilos.edumind.es.access.log;
    error_log /var/log/nginx/hilos.edumind.es.error.log warn;

    include /etc/nginx/sites-available/hilos-security-headers.inc;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/javascript text/plain;

    # API opcional (relé y buzón de sincronización). Solo ciphertext.
    location /api/ {
        include /etc/nginx/sites-available/hilos-security-headers.inc;
        proxy_pass http://127.0.0.1:3280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        include /etc/nginx/sites-available/hilos-security-headers.inc;
        access_log off;
        add_header Content-Type text/plain;
        return 200 'hilo ok';
    }

    # El service worker NUNCA se cachea en el navegador: es lo que permite
    # publicar una versión nueva y que las tablets la recojan.
    location = /sw.js {
        include /etc/nginx/sites-available/hilos-security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/sites-available/hilos-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Los ficheros de /assets/ llevan hash en el nombre: inmutables.
    location /assets/ {
        include /etc/nginx/sites-available/hilos-security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/sites-available/hilos-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
